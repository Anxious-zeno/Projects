<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up Form UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body data-theme="dark">
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to light mode" title="Switch to light mode">
        <i class="fa-solid fa-sun" aria-hidden="true"></i>
    </button>
    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div>

    <div class="auth-wrapper">
        <div class="auth-card" id="authCard">

           
            <div class="form-panel login-panel">
                <div class="logo">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1>Welcome</h1>
                <p class="subtitle">Login to continue your journey</p>

                <form action="cgi-bin/login.cgi" method="POST" class="sign-in-form">
               
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" id="loginUsername" name="username" placeholder=" " autocomplete="username" required>
                        <label for="loginUsername">
                            Username
                        </label>
                    </div>

             
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="loginPassword" name="password" placeholder=" " autocomplete="current-password" required>
                        <label for="loginPassword">
                            Password
                        </label>
                        <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)" aria-label="Show password">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>

                    <div class="options">
                        <label class="checkbox">
                            <input type="checkbox">
                            Remember me
                        </label>
                        <a href="#">
                            Forgot Password?
                        </a>
                    </div>
                    
                    <button type="submit" class="main-btn">LOG IN</button>
                </form>

                <div class="switch-area">
                    <span>
                        Don't have an account?
                    </span>
                    <button type="button" class="switch-circle" onclick="flipCard()">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>


            <div class="form-panel signup-panel">
                <div class="logo">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1>Create Account</h1>
                <p class="subtitle">
                    Start your journey with us
                </p>

                <form action="cgi-bin/register.cgi" method="POST" class="sign-up-form">
                    <!-- Name -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" id="signupUsername" name="username" placeholder=" " autocomplete="username" required>
                        <label for="signupUsername">
                            Username
                        </label>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="email" id="signupEmail" placeholder=" " autocomplete="email" required>
                        <label for="signupEmail">
                           Email Address
                        </label>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="signupPassword" name="password" placeholder=" " autocomplete="new-password" required>
                        <label for="signupPassword">
                            Password
                        </label>
                        <button type="button" class="password-toggle" onclick="togglePassword('signupPassword', this)" aria-label="Show password">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="confirmPassword" placeholder=" " autocomplete="new-password" required>
                        <label for="confirmPassword">
                           Confirm Password
                        </label>
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)" aria-label="Show password">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    
                    <button type="submit" class="main-btn">CREATE ACCOUNT</button>
                </form>

                <div class="switch-area">
                    <span>
                        Already have an account?
                    </span>
                    <button type="button" class="switch-circle" onclick="flipCard()">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
